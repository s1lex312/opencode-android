name: Release

# Builds the debug APK (and, best effort, the arm64 local-env bundle) and publishes both as
# GitHub Release assets. Runs on a version tag (`v1.2.3`) or manually from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/publish, e.g. v1.0.0'
        required: true
        default: 'v1.0.0'
      build_bundle:
        description: 'Also build and attach the arm64 local-env bundle (slow, ~5 min)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest ships the Android SDK (ANDROID_HOME + accepted licenses) with platform 34
      # and build-tools 34.0.0, which is exactly what this project targets.

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --console=plain assembleDebug

      - name: Rename APK and compute checksum
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/opencode-android-${VERSION}.apk"
          ( cd release && sha256sum "opencode-android-${VERSION}.apk" > SHA256SUMS.txt )
          ls -la release
          cat release/SHA256SUMS.txt

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="release/opencode-android-${VERSION}.apk"
          SIZE="$(stat -c%s "$APK")"
          echo "APK: $APK ($SIZE bytes)"
          [ "$SIZE" -gt 5000000 ] || { echo "::error title=tiny APK::APK is suspiciously small ($SIZE bytes)"; exit 1; }
          unzip -t "$APK" > /dev/null || { echo "::error title=broken APK::APK is not a valid zip archive"; exit 1; }
          unzip -l "$APK" | grep -q 'classes.dex' || { echo "::error title=broken APK::no classes.dex inside"; exit 1; }
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          "${BT}/aapt" dump badging "$APK" | head -n 6

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: release/
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: Build arm64 bundle
    if: github.event_name == 'push' || inputs.build_bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Third-party artifacts (Termux proot, ubuntu-base, opencode release) may move; a failure here
    # must not block the APK release. The release notes link to the manual build instructions.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file pkg-config

      - name: Fetch arm64 proot (Termux build) and its libraries
        run: |
          set -euo pipefail
          BASE=https://packages.termux.dev/apt/termux-main
          curl -fsSL "$BASE/dists/stable/main/binary-aarch64/Packages" -o Packages
          pick() {
            awk -v pkg="$1" 'BEGIN{RS="";FS="\n"} $1=="Package: "pkg {for(i=1;i<=NF;i++) if($i ~ /^Filename: /){sub("^Filename: ","",$i); print $i; exit}}' Packages | head -n1
          }
          mkdir -p debs termux
          for pkg in proot libtalloc libandroid-support; do
            f="$(pick "$pkg")"
            [ -n "$f" ] || { echo "::error title=termux package missing::no Filename for $pkg"; exit 1; }
            curl -fsSL "$BASE/$f" -o "debs/$pkg.deb"
            mkdir -p "termux/$pkg"
            ( cd "termux/$pkg" && ar x "../../debs/$pkg.deb" && tar xf data.tar.* )
          done
          PROOT_BIN="$(find termux -type f -path '*bin/proot' | head -n1)"
          file "$PROOT_BIN"
          file "$PROOT_BIN" | grep -qi 'aarch64' || { echo "::error title=wrong ABI::packaged proot is not arm64"; exit 1; }
          cp "$PROOT_BIN" proot-aarch64
          chmod 755 proot-aarch64
          mkdir -p proot-libs
          find termux -type f -path '*usr/lib/*' -name '*.so*' -exec cp -a {} proot-libs/ \;

      - name: Build bundle
        run: |
          bash server/scripts/build-rootfs.sh \
            --mode full \
            --output dist \
            --version "${VERSION}-${GITHUB_RUN_NUMBER}" \
            --proot ./proot-aarch64 \
            --proot-libs ./proot-libs \
            --download-base \
            --download-opencode
          cat dist/manifest.json

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-rootfs-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: [apk]
    if: always() && needs.apk.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: release

      - name: Download bundle (optional)
        id: bundle
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-rootfs-bundle
          path: release/bundle

      - name: Flatten bundle assets
        run: |
          set -euo pipefail
          if [ -d release/bundle ]; then
            cp -v release/bundle/* release/ || true
          fi
          ls -la release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: opencode for Android ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## opencode for Android ${{ env.VERSION }}

            Нативное Android-приложение для [opencode](https://github.com/anomalyco/opencode).

            ### Установка
            1. Скачайте `opencode-android-${{ env.VERSION }}.apk` ниже.
            2. Разрешите установку из неизвестных источников и установите APK (Android 8.0+, arm64).
            3. При первом запуске приложение предложит поставить окружение для Local mode
               (скачивание ~120 МБ) или подключиться к вашему серверу (Remote mode).

            ### Что внутри релиза
            - `opencode-android-${{ env.VERSION }}.apk` — debug-подписанный APK (~19 МБ).
            - `SHA256SUMS.txt` — контрольная сумма APK.
            - `opencode-env-*.tar.gz` + `manifest.json` + `.sha256` — bundle для Local mode
              (arm64). Если ассета нет, используйте инструкцию
              [server/README.md](https://github.com/${{ github.repository }}/blob/main/server/README.md).

            Проверка целостности: `sha256sum -c SHA256SUMS.txt`.
          files: |
            release/opencode-android-*.apk
            release/SHA256SUMS.txt
            release/opencode-env-*.tar.gz
            release/opencode-env-*.tar.gz.sha256
            release/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
