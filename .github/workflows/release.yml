name: Release

# Publishes two APKs to one GitHub Release:
#   * opencode-android-full-<tag>.apk  — environment bundled inside (~125 MB), works offline
#   * opencode-android-lite-<tag>.apk  — thin client (~19 MB), downloads/imports the environment
# plus SHA256SUMS.txt and, when the bundle builds, the arm64 environment archive itself.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/publish, e.g. v1.0.2'
        required: true
        default: 'v1.0.2'
      build_bundle:
        description: 'Build and attach the arm64 local-env bundle (slow, ~5 min)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # -------------------------------------------------------------------------------------------
  # The arm64 environment (proot + rootfs + opencode) that goes into the Full APK / release.
  # -------------------------------------------------------------------------------------------
  bundle:
    name: Build arm64 bundle
    if: github.event_name == 'push' || inputs.build_bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Third-party artifacts (Termux proot, ubuntu-base, opencode release) may move; a failure here
    # must not block the APK release — the Lite APK always ships, the Full one is skipped.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file pkg-config

      - name: Fetch arm64 proot (Termux build) and its libraries
        run: |
          set -euo pipefail
          BASE=https://packages.termux.dev/apt/termux-main
          curl -fsSL "$BASE/dists/stable/main/binary-aarch64/Packages" -o Packages
          pick() {
            awk -v pkg="$1" 'BEGIN{RS="";FS="\n"} $1=="Package: "pkg {for(i=1;i<=NF;i++) if($i ~ /^Filename: /){sub("^Filename: ","",$i); print $i; exit}}' Packages | head -n1
          }
          mkdir -p debs termux
          for pkg in proot libtalloc libandroid-support; do
            f="$(pick "$pkg")"
            [ -n "$f" ] || { echo "::error title=termux package missing::no Filename for $pkg"; exit 1; }
            curl -fsSL "$BASE/$f" -o "debs/$pkg.deb"
            mkdir -p "termux/$pkg"
            ( cd "termux/$pkg" && ar x "../../debs/$pkg.deb" && tar xf data.tar.* )
          done
          PROOT_BIN="$(find termux -type f -path '*bin/proot' | head -n1)"
          file "$PROOT_BIN"
          file "$PROOT_BIN" | grep -qi 'aarch64' || { echo "::error title=wrong ABI::packaged proot is not arm64"; exit 1; }
          cp "$PROOT_BIN" proot-aarch64
          chmod 755 proot-aarch64
          mkdir -p proot-libs
          find termux -type f -path '*usr/lib/*' -name '*.so*' -exec cp -a {} proot-libs/ \;
          # proot execs its loader, so it has to be executable too: ship it with the libs and let
          # extract-proot-jnilibs.sh put it next to libproot.so as libproot_loader.so.
          find termux -type f \( -name 'loader*' -o -path '*libexec/proot/*' \) -exec cp -a {} proot-libs/ \;
          ls -la proot-libs

      - name: Build bundle
        run: |
          bash server/scripts/build-rootfs.sh \
            --mode full \
            --output dist \
            --version "${VERSION}-${GITHUB_RUN_NUMBER}" \
            --proot ./proot-aarch64 \
            --proot-libs ./proot-libs \
            --download-base \
            --download-opencode
          cat dist/manifest.json

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-rootfs-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # -------------------------------------------------------------------------------------------
  # Lite APK: no environment inside.
  # -------------------------------------------------------------------------------------------
  lite:
    name: Build Lite APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Package the proot runtime as native libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y patchelf file
          bash .github/scripts/extract-proot-jnilibs.sh \
            app/src/full/assets/local-env.tar.gz \
            app/src/full/jniLibs/arm64-v8a
          ls -la app/src/full/jniLibs/arm64-v8a

      - name: Unit tests
        run: ./gradlew --no-daemon --console=plain testLiteDebugUnitTest

      - name: Assemble Lite APK
        run: ./gradlew --no-daemon --console=plain assembleLiteDebug

      - name: Rename and checksum
        run: |
          set -euo pipefail
          mkdir -p release
          APK="$(ls app/build/outputs/apk/lite/debug/*.apk | head -n1)"
          cp "$APK" "release/opencode-android-lite-${VERSION}.apk"
          ls -la release

      - name: Verify APK
        run: bash .github/scripts/verify-apk.sh "release/opencode-android-lite-${VERSION}.apk"

      - name: Upload Lite artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-lite
          path: release/opencode-android-lite-*.apk
          if-no-files-found: error
          retention-days: 30

  # -------------------------------------------------------------------------------------------
  # Full APK: the bundle is unpacked into app/src/full/assets before assembling.
  # -------------------------------------------------------------------------------------------
  full:
    name: Build Full APK
    needs: [bundle]
    if: needs.bundle.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Download environment bundle
        uses: actions/download-artifact@v4
        with:
          name: release-rootfs-bundle
          path: dist

      - name: Embed bundle into the Full flavor
        run: |
          set -euo pipefail
          mkdir -p app/src/full/assets
          BUNDLE="$(ls dist/opencode-env-*-arm64.tar.gz | head -n1)"
          echo "bundle: $BUNDLE ($(stat -c%s "$BUNDLE") bytes)"
          # Canonical name, no matter what upstream called the file (some asset servers trim ".gz").
          rm -f app/src/full/assets/local-env.tar app/src/full/assets/local-env.tar.gz
          cp "$BUNDLE" app/src/full/assets/local-env.tar.gz
          [ -f app/src/full/assets/local-env.tar.gz ] || { echo "::error title=embed failed::local-env.tar.gz was not created"; exit 1; }
          [ "$(stat -c%s app/src/full/assets/local-env.tar.gz)" -gt 100000000 ] || { echo "::error title=embed failed::bundle is too small"; exit 1; }
          ls -la app/src/full/assets
          sha256sum app/src/full/assets/local-env.tar.gz
          # Regenerate the manifest that the app reads from assets (version + hash + size).
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re

          bundle = pathlib.Path("app/src/full/assets/local-env.tar.gz")
          digest = hashlib.sha256(bundle.read_bytes()).hexdigest()
          manifest_path = pathlib.Path("dist/manifest.json")
          version = "unset"
          if manifest_path.is_file():
              version = json.loads(manifest_path.read_text()).get("version", "unset")
          # The packaged bytes are repackaged by aapt2 (extension and gzip wrapper change), so a
          # build-time hash cannot match what ends up inside the APK. Embedded bundles are trusted
          # through the APK signature instead; the source hash stays in the build log for reference.
          pathlib.Path("app/src/full/assets/local-env.json").write_text(json.dumps({
              "version": version,
              "abi": "arm64-v8a",
              "url": "",
              "asset": "local-env.tar.gz",
              "sha256": "",
              "sizeBytes": bundle.stat().st_size,
              "notes": "Embedded into the Full APK. Integrity comes from the APK signature; "
                       "aapt2 repackages the archive, so no build-time hash is published.",
          }, indent=2) + "\n")
          print("embedded", version, digest, bundle.stat().st_size)
          PY

      - name: Package the proot runtime as native libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y patchelf file
          bash .github/scripts/extract-proot-jnilibs.sh \
            app/src/full/assets/local-env.tar.gz \
            app/src/full/jniLibs/arm64-v8a
          ls -la app/src/full/jniLibs/arm64-v8a

      - name: Unit tests
        run: ./gradlew --no-daemon --console=plain testLiteDebugUnitTest

      - name: Assemble Full APK
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --console=plain assembleFullDebug 2>&1 | tee full-build.log; then
            MSG="$(grep -E 'Full APK |does not contain|only [0-9]+ bytes|What went wrong|FAILURE: Build|> Task .*FAILED' full-build.log \
              | tail -n 12 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=Full APK build failed::${MSG}"
            exit 1
          fi
          grep -E 'Full APK verified' full-build.log || true
          echo "::notice title=Full APK bundled::$(grep -E 'Full APK verified' full-build.log | tail -n 1)"

      - name: Rename and checksum
        run: |
          set -euo pipefail
          mkdir -p release
          APK="$(ls app/build/outputs/apk/full/debug/*.apk | head -n1)"
          cp "$APK" "release/opencode-android-full-${VERSION}.apk"
          ls -la release

      - name: Upload Full artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-full
          path: release/opencode-android-full-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify APK
        env:
          EXPECT_MIN_BYTES: '120000000'
        run: bash .github/scripts/verify-apk.sh "release/opencode-android-full-${VERSION}.apk"


  # -------------------------------------------------------------------------------------------
  # One release, both APKs.
  # -------------------------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [lite, full]
    # Never publish a release whose Full APK is missing or broken: both variants must pass.
    if: needs.lite.result == 'success' && needs.full.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Lite APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk-lite
          path: release

      - name: Download Full APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk-full
          path: release

      - name: Download bundle (optional)
        id: bundle
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-rootfs-bundle
          path: release/bundle

      - name: Collect assets and checksums
        run: |
          set -euo pipefail
          if [ -d release/bundle ]; then
            cp -v release/bundle/* release/ || true
            rmdir release/bundle 2>/dev/null || true
          fi
          ( cd release && sha256sum opencode-android-*.apk opencode-env-*.tar.gz 2>/dev/null > SHA256SUMS.txt || true )
          ls -la release
          cat release/SHA256SUMS.txt
          # Surface the exact sizes in the run summary: a "Full" APK below ~120 MB is a red flag.
          FULL="$(stat -c%s release/opencode-android-full-*.apk)"
          LITE="$(stat -c%s release/opencode-android-lite-*.apk)"
          echo "::notice title=Release APKs::full=$FULL bytes, lite=$LITE bytes, tag=${VERSION}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: opencode for Android ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## opencode for Android ${{ env.VERSION }}

            Нативное Android-приложение для [opencode](https://github.com/anomalyco/opencode).

            ### Какой APK скачать

            | Вариант | Размер | Что внутри | Кому |
            | --- | --- | --- | --- |
            | **Full** — `opencode-android-full-${{ env.VERSION }}.apk` | ~125 МБ | proot + rootfs + opencode встроены в APK | Local mode **без интернета**: скачал, установил, работает |
            | **Lite** — `opencode-android-lite-${{ env.VERSION }}.apk` | ~19 МБ | только клиент | Remote mode или Local mode со скачиванием окружения при первом запуске |

            Обе версии имеют одинаковый `applicationId`, поэтому ставятся друг поверх друга как
            обновление (настройки и уже распакованное окружение сохраняются).

            ### Установка
            1. Скачайте нужный APK (проверка целостности: `sha256sum -c SHA256SUMS.txt`).
            2. Разрешите установку из неизвестных источников и установите файл.
            3. Full: Local mode стартует сразу, офлайн. Lite: вставьте URL bundle и SHA-256,
               импортируйте файл, либо переключитесь в Remote mode.

            Требования: Android 8.0+; для Local mode — arm64-устройство.

            **Проверка варианта:** в приложении Setup → «Build» показывает, например,
            `full-debug ${{ env.VERSION }}-full-debug`. Если там `lite`, установился не тот файл
            (или установщик отклонил обновление — удалите старое приложение и поставьте Full заново).

            ### Дополнительно
            - `SHA256SUMS.txt` — контрольные суммы APK и bundle.
            - `opencode-env-*.tar.gz` + `manifest.json` + `.sha256` — окружение для Local mode
              (нужно Lite-версии; можно импортировать файлом или скачать по URL).
              Если ассета нет — соберите его по инструкции
              [server/README.md](https://github.com/${{ github.repository }}/blob/main/server/README.md).
          files: |
            release/opencode-android-full-*.apk
            release/opencode-android-lite-*.apk
            release/SHA256SUMS.txt
            release/opencode-env-*.tar.gz
            release/opencode-env-*.tar.gz.sha256
            release/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
