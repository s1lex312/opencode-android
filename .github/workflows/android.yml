name: Android CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest ships the Android SDK (ANDROID_HOME + accepted licenses) with
      # platform 34 and build-tools 34.0.0, which is exactly what this project targets.

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain testDebugUnitTest --stacktrace 2>&1 | tee unit-tests.log

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain assembleDebug --stacktrace 2>&1 | tee assemble-debug.log

      - name: Report build errors as annotations
        if: failure()
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            let out = "";
            const dir = "app/build/test-results/testDebugUnitTest";
            if (fs.existsSync(dir)) {
              for (const f of fs.readdirSync(dir).filter((x) => x.endsWith(".xml"))) {
                const xml = fs.readFileSync(path.join(dir, f), "utf8");
                const re = /<testcase[^>]*name="([^"]*)"[^>]*classname="([^"]*)"([\s\S]*?)<\/testcase>/g;
                let m;
                while ((m = re.exec(xml)) !== null) {
                  const body = m[3];
                  const fm = /<failure[^>]*message="([^"]*)"/.exec(body) ||
                             /<failure[^>]*>([\s\S]*?)<\/failure>/.exec(body);
                  if (fm) out += "FAILED " + m[2] + "." + m[1] + " :: " + String(fm[1]).slice(0, 800) + "\n";
                }
              }
            }
            for (const f of ["unit-tests.log", "assemble-debug.log"]) {
              if (!fs.existsSync(f)) continue;
              const lines = fs.readFileSync(f, "utf8").split("\n");
              const errs = lines.filter((l) =>
                /^e: |error:|FAILURE: Build|Caused by:|What went wrong|Execution failed/.test(l));
              if (errs.length) out += "--- " + f + " ---\n" + errs.slice(0, 60).join("\n") + "\n";
            }
            if (!out.trim()) out = "no matching failures";
            const escaped = out.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A");
            console.log("::error title=Build/test failure::" + escaped.slice(0, 50000));
          '

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            unit-tests.log
            assemble-debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
