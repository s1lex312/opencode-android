name: Android CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest ships the Android SDK (ANDROID_HOME + accepted licenses) with
      # platform 34 and build-tools 34.0.0, which is exactly what this project targets.

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain testDebugUnitTest --stacktrace 2>&1 | tee unit-tests.log

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain assembleDebug --stacktrace 2>&1 | tee assemble-debug.log

      - name: Report build errors as annotations
        if: failure()
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            let out = "";
            const dir = "app/build/test-results/testDebugUnitTest";
            if (fs.existsSync(dir)) {
              for (const f of fs.readdirSync(dir).filter((x) => x.endsWith(".xml"))) {
                const xml = fs.readFileSync(path.join(dir, f), "utf8");
                const re = /<testcase[^>]*name="([^"]*)"[^>]*classname="([^"]*)"([\s\S]*?)<\/testcase>/g;
                let m;
                while ((m = re.exec(xml)) !== null) {
                  const body = m[3];
                  const fm = /<failure[^>]*message="([^"]*)"/.exec(body) ||
                             /<failure[^>]*>([\s\S]*?)<\/failure>/.exec(body);
                  if (fm) out += "FAILED " + m[2] + "." + m[1] + " :: " + String(fm[1]).slice(0, 800) + "\n";
                }
              }
            }
            for (const f of ["unit-tests.log", "assemble-debug.log"]) {
              if (!fs.existsSync(f)) continue;
              const lines = fs.readFileSync(f, "utf8").split("\n");
              const errs = lines.filter((l) =>
                /^e: |error:|FAILURE: Build|Caused by:|What went wrong|Execution failed/.test(l));
              if (errs.length) out += "--- " + f + " ---\n" + errs.slice(0, 60).join("\n") + "\n";
            }
            if (!out.trim()) out = "no matching failures";
            const escaped = out.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A");
            console.log("::error title=Build/test failure::" + escaped.slice(0, 50000));
          '

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            unit-tests.log
            assemble-debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  rootfs-stub:
    name: Rootfs packaging (stub)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build stub bundle
        run: |
          bash server/scripts/build-rootfs.sh \
            --mode stub \
            --output dist \
            --version "ci-${GITHUB_RUN_NUMBER}"

      - name: Verify bundle and manifest
        run: |
          set -euo pipefail
          SHA="$(python3 -c 'import json;print(json.load(open("dist/manifest.json"))["sha256"])')"
          bash server/scripts/verify-artifact.sh dist/opencode-env-*.tar.gz "$SHA"
          echo "::notice title=Rootfs manifest::version=$(python3 -c 'import json;print(json.load(open("dist/manifest.json"))["version"])') sha256=$SHA"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-stub-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 7

  rootfs-full:
    name: Rootfs arm64 bundle (best effort)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Upstream wasm/binary layouts change from time to time; a failure here must not block the app
    # build. The produced artifact is validated on a real device (see docs/SMOKE-TEST.md).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            curl file pkg-config libpython3-dev

      - name: Build arm64 talloc
        run: |
          set -euo pipefail
          curl -fsSL https://www.samba.org/ftp/talloc/talloc-2.4.2.tar.gz -o talloc.tar.gz
          tar xf talloc.tar.gz
          cd talloc-2.4.2
          if ! ./configure --host=aarch64-linux-gnu --disable-python --without-gettext \
                 --prefix="$GITHUB_WORKSPACE/talloc-arm64" > /tmp/talloc.log 2>&1; then
            echo "::error title=talloc configure failed::$(tail -c 3000 /tmp/talloc.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          if ! make -j"$(nproc)" >> /tmp/talloc.log 2>&1 || ! make install >> /tmp/talloc.log 2>&1; then
            echo "::error title=talloc build failed::$(tail -c 3000 /tmp/talloc.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          ls "$GITHUB_WORKSPACE/talloc-arm64/lib" | head

      - name: Build static arm64 proot
        run: |
          set -euo pipefail
          # proot needs libtalloc for the *target* architecture, hence the step above.
          git clone --depth 1 https://github.com/proot-me/proot.git proot-src
          cd proot-src/src
          # CFLAGS/LDFLAGS are exported (not passed on the command line) so that the
          # makefile can still append the talloc flags it discovers via pkg-config.
          # WITHOUT_PYTHON drops the swig extension (it links the host libpython and
          # breaks cross/static builds); CROSS_COMPILE picks the aarch64 toolchain.
          export CFLAGS="-O2"
          export LDFLAGS="-static"
          if ! PKG_CONFIG_PATH="$GITHUB_WORKSPACE/talloc-arm64/lib/pkgconfig" \
                 make -j"$(nproc)" CROSS_COMPILE=aarch64-linux-gnu- WITHOUT_PYTHON=1 \
                 PKG_CONFIG=pkg-config \
                 > /tmp/proot.log 2>&1; then
            echo "::error title=proot build failed::$(tail -c 3000 /tmp/proot.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          BIN="$(find .. -maxdepth 3 -type f -name proot -perm -u+x | head -n 1)"
          file "$BIN"
          file "$BIN" | grep -qi 'aarch64' || { echo "::error title=wrong ABI::proot was not built for arm64"; exit 1; }
          cp "$BIN" "$GITHUB_WORKSPACE/proot-aarch64"

      - name: Build arm64 bundle
        run: |
          bash server/scripts/build-rootfs.sh \
            --mode full \
            --output dist \
            --version "ci-${GITHUB_RUN_NUMBER}" \
            --proot ./proot-aarch64 \
            --download-base \
            --download-opencode

      - name: Show manifest
        run: cat dist/manifest.json

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-arm64-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 14
